name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build + Bundle Budget
        run: npm run build:ci

  backend:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-with-32-byte-minimum-length
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_CORE_NAME: rps_db
      DB_USER: rps_user
      DB_PASSWORD: rps_password
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: local
      DEV_AUTO_LOGIN: "true"
      RPS_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install dependencies
        run: pipenv sync --dev

      - name: Dependency drift check
        run: pipenv run python ../scripts/sync_backend_requirements.py --check

      - name: Django system check
        run: pipenv run python manage.py check

      - name: Backend smoke and refactor guards
        env:
          DJANGO_SETTINGS_MODULE: rps.settings.test
        run: >-
          pipenv run python -m pytest
          apps/importer/tests/test_bulk_writes.py
          apps/importer/tests/test_api_smoke.py
          apps/exporter/tests/test_export_views.py
          apps/reporting/tests/test_report_views.py
          apps/results/tests/test_phase2_backend_refactor.py

  phase0-baseline:
    name: Phase 0 Baseline Capture
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-with-32-byte-minimum-length
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_CORE_NAME: rps_db
      DB_USER: rps_user
      DB_PASSWORD: rps_password
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: local
      DEV_AUTO_LOGIN: "true"
      RPS_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install backend dependencies
        run: pipenv sync --dev

      - name: Capture baseline report
        run: pipenv run python ../scripts/capture_phase0_baseline.py

      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase0-baseline-report
          path: |
            docs/refactor/phase-0-baseline-report.md
            docs/refactor/phase-0-baseline-report.json
